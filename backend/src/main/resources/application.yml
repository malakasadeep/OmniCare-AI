spring:
  application:
    name: omnicare-platform
  datasource:
    url: jdbc:postgresql://localhost:5433/omnicare
    # Deliberately not the POSTGRES_USER. That role is a superuser, and
    # superusers bypass row level security outright. See docker/postgres-init.
    username: ${DB_USER:omnicare_app}
    password: ${DB_PASSWORD:omnicare_app_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true

omnicare:
  llm:
    # Flip to `groq` (with GROQ_API_KEY set) for a real model. This one value is
    # the whole switch — no code changes hands.
    provider: ${LLM_PROVIDER:fake}
    model: ${LLM_MODEL:llama-3.3-70b-versatile}
    # Low, not zero: support answers should be steady rather than inventive.
    temperature: ${LLM_TEMPERATURE:0.3}
    max-tokens: ${LLM_MAX_TOKENS:1024}
    # How much of the context window one prompt may use. Deliberately well below
    # the model's real limit: the token count is an estimate that under-counts
    # non-Latin scripts, and the answer needs room the prompt budget does not cover.
    token-budget: ${LLM_TOKEN_BUDGET:8000}
    timeout: ${LLM_TIMEOUT:30s}
    groq:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      # Empty by default, and the provider bean is not created without it, so a
      # deployment that forgot the key fails at startup instead of on a visitor's
      # first message.
      api-key: ${GROQ_API_KEY:}

  jwt:
    # Dev-only fallback so a fresh clone runs without setup. Production sets
    # JWT_SECRET; changing it invalidates every token already issued, which is
    # the only revocation a stateless scheme has.
    secret: ${JWT_SECRET:dev-only-insecure-secret-replace-me-in-every-real-environment}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.omnicare.platform: DEBUG