spring:
  application:
    name: omnicare-platform
  datasource:
    url: jdbc:postgresql://localhost:5433/omnicare
    username: ${DB_USER:omnicare}
    password: ${DB_PASSWORD:omnicare_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true

omnicare:
  jwt:
    # Dev-only fallback so a fresh clone runs without setup. Production sets
    # JWT_SECRET; changing it invalidates every token already issued, which is
    # the only revocation a stateless scheme has.
    secret: ${JWT_SECRET:dev-only-insecure-secret-replace-me-in-every-real-environment}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.omnicare.platform: DEBUG