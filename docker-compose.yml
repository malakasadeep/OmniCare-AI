services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnicare-postgres
    environment:
      POSTGRES_DB: omnicare
      POSTGRES_USER: omnicare
      POSTGRES_PASSWORD: omnicare_dev
    ports:
      - "5433:5432"
    volumes:
      - omnicare-pgdata:/var/lib/postgresql/data
      # Runs only on a fresh volume. Creates the extensions and the
      # non-superuser role the application connects as — a superuser would
      # bypass every row level security policy in V3.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicare"]
      interval: 5s
      retries: 10

volumes:
  omnicare-pgdata: